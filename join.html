<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shake for Love</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<div class="screen active flex-col-center">


<div class="eyebrow">
Shake for Love
</div>


<h1>
Join the game
</h1>


<p class="subtext">
Enter room code, name and avatar
</p>



<input 
id="roomCode"
maxlength="4"
placeholder="ROOM CODE"
style="
text-transform:uppercase;
text-align:center;
font-size:25px;
letter-spacing:8px;
">


<input 
id="playerName"
maxlength="20"
placeholder="Your name"
>



<h3>
Choose Avatar
</h3>


<div class="avatar-grid" id="avatars"></div>



<button 
class="btn-primary"
id="joinBtn"
disabled>

Join Party

</button>


<p id="error"></p>


</div>



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>



<script>


const AVATARS=[
"💃","🕺","👰","🤵",
"🥂","💍","🌸",
"🎩","✨","🎉",
"🦋","🌹"
];


let selectedAvatar="";

const grid=document.getElementById("avatars");


AVATARS.forEach(a=>{


let div=document.createElement("div");

div.className="avatar-opt";

div.innerHTML=a;


div.onclick=()=>{

document
.querySelectorAll(".avatar-opt")
.forEach(x=>x.classList.remove("selected"));


div.classList.add("selected");

selectedAvatar=a;


check();

};


grid.appendChild(div);


});



function check(){


joinBtn.disabled=!(
roomCode.value.length===4 &&
playerName.value.trim() &&
selectedAvatar
);


}



roomCode.oninput=check;
playerName.oninput=check;



joinBtn.onclick=async()=>{


let code=
roomCode.value.toUpperCase();


let name=
playerName.value.trim();



let roomSnap=
await db.ref(
"rooms/"+code
)
.once("value");



if(!roomSnap.exists()){


error.innerHTML=
"Room not found";


return;


}



let playerId=
"p_"+
Math.random()
.toString(36)
.substring(2)
+
Date.now();



await db.ref(
`rooms/${code}/players/${playerId}`
)
.set({

name:name,

avatar:selectedAvatar,

shakes:0,

joinedAt:
firebase.database.ServerValue.TIMESTAMP

});




// SAVE PLAYER ID

localStorage.setItem(
"playerId",
playerId
);


// GO NEXT PAGE AUTOMATICALLY

window.location.href=
`waiting.html?room=${code}&id=${playerId}`;



};



</script>


</body>
</html>
