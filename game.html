<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Shake Game</title>

<link rel="stylesheet" href="style.css">


<style>

.big-number{

font-size:120px;
font-family:'Fraunces',serif;
font-weight:700;
color:var(--gold-bright);

}


.shake-number{

font-size:70px;
font-family:'Fraunces',serif;
color:var(--gold-bright);

}


</style>


</head>


<body>



<div class="screen active flex-col-center">



<div class="eyebrow">
SHAKE FOR LOVE
</div>


<h2 id="title">
Get Ready
</h2>


<div 
class="big-number"
id="countdown">

5

</div>



<div id="gameArea"
style="display:none;text-align:center">


<div class="timer-badge"
id="timer">

60s

</div>



<div class="shake-number"
id="shakeCount">

0

</div>



<p>
SHAKES ❤️
</p>


<p class="subtext">

Shake your phone!

<br>

or tap the screen

</p>


</div>


</div>





<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="firebase-config.js"></script>



<script>


const params =
new URLSearchParams(
window.location.search
);



const room =
params.get("room");


const playerId =
params.get("id");



const roomRef =
db.ref(
"rooms/"+room
);



let shakes=0;

let playing=false;


let lastShake=0;



let writeTimer;



let serverOffset=0;



db.ref(".info/serverTimeOffset")
.on("value",s=>{

serverOffset=
s.val()||0;

});



function serverNow(){

return Date.now()+serverOffset;

}




// =======================
// STATUS LISTENER
// =======================


roomRef
.child("status")
.on("value",snap=>{


let status=snap.val();



if(status==="countdown"){

startCountdown();

}



if(status==="playing"){

startGame();

}



if(status==="finished"){

window.location.href=
`result.html?room=${room}&id=${playerId}`;

}



});






// =======================
// COUNTDOWN
// =======================


function startCountdown(){



document
.getElementById("title")
.innerHTML=
"Get Ready!";



roomRef
.child("gameStart")
.once("value")
.then(snap=>{


let start=
snap.val();



let timer=setInterval(()=>{


let remain=
Math.ceil(
(start-serverNow())/1000
);



document
.getElementById("countdown")
.innerHTML=
remain>0?remain:"GO!";



if(remain<=0){


clearInterval(timer);



}


},200);



});



}







// =======================
// START GAME
// =======================


function startGame(){



document
.getElementById("countdown")
.style.display="none";


document
.getElementById("gameArea")
.style.display="block";


playing=true;


shakes=0;


document
.getElementById("shakeCount")
.innerHTML=0;



startTimer();


startMotion();


}





// =======================
// TIMER
// =======================


function startTimer(){



roomRef
.child("gameEnd")
.once("value")
.then(snap=>{


let end=
snap.val();



let timer=setInterval(()=>{


let remain=
Math.ceil(
(end-serverNow())/1000
);



document
.getElementById("timer")
.innerHTML=
Math.max(remain,0)+"s";



if(remain<=0){


clearInterval(timer);


playing=false;


saveScore();


}


},200);



});



}






// =======================
// SHAKE DETECTION
// =======================


function startMotion(){



window.addEventListener(
"devicemotion",
detectShake
);



document.body.onclick=()=>{


if(playing){

addShake();

}


};



}





function detectShake(e){


if(!playing)return;


let acc=
e.accelerationIncludingGravity;



if(!acc)return;



let force=Math.sqrt(

acc.x*acc.x+
acc.y*acc.y+
acc.z*acc.z

);



let now=
Date.now();



if(
force>18 &&
now-lastShake>300
){


lastShake=now;


addShake();


}


}







function addShake(){


shakes++;


document
.getElementById("shakeCount")
.innerHTML=
shakes;



clearTimeout(writeTimer);



writeTimer=setTimeout(()=>{


roomRef
.child(
"players/"+playerId+"/shakes"
)
.set(shakes);



},100);



}






function saveScore(){


roomRef
.child(
"players/"+playerId+"/shakes"
)
.set(shakes);



}



</script>


</body>

</html>
