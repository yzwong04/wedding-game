<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">


<title>Shake For Love Host</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="screen active wide flex-col-center">



<div class="eyebrow">
HOST SCREEN
</div>


<h1>
Shake For Love 💕
</h1>



<div id="setup">


<input 
id="eventName"
placeholder="Wedding Name">


<button 
class="btn-primary"
id="create">

Create Room

</button>


</div>





<div id="game"
style="display:none;width:100%;text-align:center">


<h2>
Room Code
</h2>



<div class="room-code"
id="room">

----</div>



<div id="qr"></div>




<div class="pill">

<span id="count">
0
</span>

players joined

</div>



<div 
id="players"
class="joined-strip">

</div>



<button
class="btn-primary"
id="start">

Start Game

</button>



<h1
id="timer">

</h1>



<div id="leaderboard"></div>



</div>





</div>






<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script src="firebase-config.js"></script>


<script src="
https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js">
</script>



<script>


let roomCode;

let roomRef;


let serverOffset=0;



db.ref(".info/serverTimeOffset")
.on("value",s=>{

serverOffset=
s.val()||0;

});



function now(){

return Date.now()+serverOffset;

}




function randomCode(){


let chars=
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


let c="";


for(let i=0;i<4;i++){

c+=chars[
Math.floor(
Math.random()*chars.length
)
];

}


return c;


}






document
.getElementById("create")
.onclick=()=>{



roomCode=
randomCode();



roomRef=
db.ref(
"rooms/"+roomCode
);



roomRef.set({

eventName:
eventName.value || 
"Shake For Love",


status:"waiting",


players:{}


});



setup.style.display="none";

game.style.display="block";



room.innerHTML=
roomCode;




let url=
location.href
.replace(
"host.html",
"join.html"
)
+
"?room="
+
roomCode;



new QRCode(
document.getElementById("qr"),
{

text:url,

width:220,

height:220

}
);



listenPlayers();



};









function listenPlayers(){



roomRef
.child("players")
.on("value",snap=>{


let players=
snap.val()||{};



let arr=
Object.values(players);



count.innerHTML=
arr.length;



playersDiv =
document.getElementById("players");


playersDiv.innerHTML="";



arr.forEach(p=>{


let d=
document.createElement("div");

d.className=
"joined-chip";


d.innerHTML=
p.avatar+
" "+
p.name;


playersDiv.appendChild(d);



});



});



}









document
.getElementById("start")
.onclick=()=>{



let start=
now()+5000;


let end=
start+60000;



roomRef.update({

status:"countdown",

gameStart:start,

gameEnd:end


});



};









roomRef?.child("status")
.on("value",snap=>{


let status=
snap.val();



if(status==="countdown"){


countdown();


}


if(status==="playing"){


playing();


}


if(status==="finished"){


finish();


}



});








function countdown(){



let timer=
setInterval(()=>{


let remain=
Math.ceil(
(
roomRef
.child("gameStart")
-
now()
)
/1000
);



},500);



}









function playing(){


let t=
setInterval(()=>{


roomRef
.child("gameEnd")
.once("value")
.then(s=>{


let remain=
Math.ceil(
(s.val()-now())/1000
);



document
.getElementById("timer")
.innerHTML=
remain;



if(remain<=0){


clearInterval(t);



roomRef.update({

status:"finished"

});


}



});


},500);



liveBoard();


}








function liveBoard(){



roomRef
.child("players")
.on("value",snap=>{


let players=
Object.values(
snap.val()||{}
);



players.sort(
(a,b)=>
(b.shakes||0)
-
(a.shakes||0)
);



leaderboard.innerHTML="";



players.slice(0,10)
.forEach((p,i)=>{


let d=
document.createElement("div");

d.className="lb-row";


d.innerHTML=

`

<div>${i+1}</div>

<div>
${p.avatar}
${p.name}
</div>

<div>
${p.shakes||0}
</div>

`;


leaderboard.appendChild(d);



});


});


}








function finish(){



alert(
"Game Finished!"
);



liveBoard();



}




</script>


</body>
</html>
