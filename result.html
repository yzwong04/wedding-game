<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">


<title>Results</title>


<link rel="stylesheet" href="style.css">


<style>

.winner{

font-size:80px;
margin:15px;

}


.place{

font-family:'Fraunces',serif;
font-size:35px;
color:var(--gold-bright);

}


</style>


</head>



<body>



<div class="screen active flex-col-center">



<div class="eyebrow">
SHAKE FOR LOVE
</div>



<h1>
🏆 Winners
</h1>



<div id="podium"></div>



<h3>
Leaderboard
</h3>



<div 
id="leaderboard"
style="
width:100%;
max-width:450px;
">
</div>



<button
class="btn-primary"
onclick="location.reload()"
style="margin-top:20px">

Waiting for next round

</button>



</div>







<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script src="firebase-config.js"></script>



<script>



const params =
new URLSearchParams(
window.location.search
);


const room =
params.get("room");



const roomRef =
db.ref(
"rooms/"+room
);





roomRef
.child("players")
.once("value")
.then(snapshot=>{


let players=
snapshot.val()||{};



let ranking=
Object.values(players)
.sort(
(a,b)=>
(b.shakes||0)
-
(a.shakes||0)
);





showPodium(
ranking.slice(0,3)
);



showLeaderboard(
ranking
);



});









function showPodium(top){



let box=
document.getElementById("podium");



let order=[
{
data:top[1],
medal:"🥈"
},

{
data:top[0],
medal:"🥇"
},

{
data:top[2],
medal:"🥉"
}

];



box.innerHTML="";



order.forEach(x=>{


if(!x.data)return;



let div=
document.createElement("div");



div.className="card";



div.style.textAlign="center";



div.innerHTML=`

<div class="winner">
${x.medal}
</div>

<div class="place">

${x.data.avatar}
${x.data.name}

</div>


<p>

${x.data.shakes||0}
shakes

</p>

`;



box.appendChild(div);



});


}









function showLeaderboard(list){



let box=
document.getElementById("leaderboard");


box.innerHTML="";



list.forEach((p,index)=>{


let row=
document.createElement("div");



row.className="lb-row";



row.innerHTML=`

<div class="lb-rank">
${index+1}
</div>


<div class="lb-avatar">
${p.avatar}
</div>


<div class="lb-name">

${p.name}

</div>


<div class="lb-score">

${p.shakes||0}

</div>


`;



box.appendChild(row);



});



}



</script>


</body>

</html>
